name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancelling older in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the build can read each file's real last-commit date
          # for <lastmod> and schema.org dateModified.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The directory data is checked before anything is built. If this fails, the
      # deploy job never runs, so the live site keeps the last good version.
      - name: Test the directory checker
        run: npm test

      - name: Get the previous directory data
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE:data/doctors.csv" 2>/dev/null; then
            git show "$BEFORE:data/doctors.csv" > "$RUNNER_TEMP/previous-doctors.csv"
          fi

      - name: Check the directory data
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          ARGS=""
          # Comparing with the previous version catches accidental mass deletions;
          # put [allow-removals] in the commit message when removing many on purpose.
          if [ -f "$RUNNER_TEMP/previous-doctors.csv" ] && [[ "$COMMIT_MESSAGE" != *"[allow-removals]"* ]]; then
            ARGS="--baseline $RUNNER_TEMP/previous-doctors.csv"
          fi
          node scripts/validate-doctors.js $ARGS

      - name: Build site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Tells Bing and other IndexNow search engines which pages changed. A failure here
  # never affects the live site: the deploy above has already finished.
  notify-search-engines:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Send the changed pages to IndexNow
        run: node scripts/indexnow.js
